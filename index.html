<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPIC SUBS v2.1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
body{
background: radial-gradient(circle at center, #1a0000 0%, #000 100%);
color:#fff;font-family:'Bebas Neue', sans-serif;
min-height:100vh;padding:8px;
}

/* HEADER ÉPICO */
.header{text-align:center;padding:12px 0;margin-bottom:10px}
.header h1{
font-size:28px;letter-spacing:3px;
background: linear-gradient(90deg, #FFD700, #FF4500, #FFD700);
-webkit-background-clip: text;-webkit-text-fill-color: transparent;
animation: glow 2s infinite;
text-shadow:0 0 30px #FFD700;
}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}

/* PANEL DE CONTROL */
.panel{
background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
border:2px solid #FFD700;border-radius:15px;
padding:15px;margin:0 auto 15px;max-width:700px;
box-shadow: 0 0 30px rgba(255,215,0,0.3);
}
.paso{color:#FFD700;font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.paso span{background:#FF4500;color:#000;padding:2px 8px;border-radius:50%;font-weight:bold}

/* BOTONES ÉPICOS */
.btn{
background: linear-gradient(180deg, #FF4500, #CC3300);
color:#fff;border:none;padding:14px 20px;font-size:15px;
border-radius:10px;margin:5px;font-weight:bold;
font-family:'Bebas Neue';letter-spacing:1px;
cursor:pointer;transition: all 0.2s;
box-shadow: 0 4px 0 #992200, 0 0 15px rgba(255,69,0,0.5);
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #992200}
.btn.verde{background: linear-gradient(180deg, #00FF00, #00CC00);box-shadow: 0 4px 0 #009900, 0 0 15px rgba(0,255,0,0.5)}
.btn.azul{background: linear-gradient(180deg, #0099FF, #0066CC);box-shadow: 0 4px 0 #004499, 0 0 15px rgba(0,153,255,0.5)}
.btn.gris{background: linear-gradient(180deg, #555, #333);box-shadow: 0 4px 0 #222}

.grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
input[type="file"]{color:#FFD700;width:100%;margin-bottom:10px}

/* CAJA DE TEXTO */
textarea{
width:100%;height:90px;background:#000;color:#FFD700;
border:2px solid #FFD700;border-radius:10px;padding:10px;
font-size:16px;font-family:Arial;resize:none;
box-shadow:inset 0 0 10px rgba(255,215,0,0.2);
}
textarea:focus{outline:none;box-shadow:inset 0 0 15px rgba(255,215,0,0.5)}

/* CONTROLES */
.control-box{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.control-group{background:#111;padding:10px;border-radius:8px;border:1px solid #333}
.control-group label{display:block;color:#FFD700;font-size:12px;margin-bottom:5px;letter-spacing:1px}
select,input[type="color"],input[type="range"]{width:100%;padding:8px;background:#000;color:#FFD700;border:1px solid #FFD700;border-radius:6px}

/* VIDEO */
.container{position:relative;display:flex;justify-content:center}
#videoPlayer{max-width:100%;border:4px solid #FFD700;border-radius:12px;box-shadow:0 0 40px rgba(255,215,0,0.4)}
#subsCanvas{position:absolute;top:0;left:0;pointer-events:none}
.estado{text-align:center;color:#00FF00;font-size:14px;margin-top:8px;font-weight:bold}

/* TUTORIAL RÁPIDO */
.tutorial{background:#0a0a0a;border-left:4px solid #FFD700;padding:10px;margin-top:10px;border-radius:5px;font-size:12px;font-family:Arial}
.tutorial b{color:#FFD700}
</style>
</head>
<body>

<div class="header">
<h1>⚔
