<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SUBTITULOS EPICOS</title>
<script src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2"></script>
<style>
body{background:#000;color:#fff;text-align:center}
h1{color:#FFD700}
button{background:#FF4500;color:#fff;padding:15px;border:none;border-radius:10px;font-size:16px}
button.descargar{background:#00FF00;color:#000}
canvas{border:3px solid #FFD700;max-width:95%}
</style>
</head>
<body>
<h1>SUBTITULOS EPICOS</h1>
<input type="file" id="videoInput" accept="video/*">
<button class="descargar" onclick="alert('Graba pantalla')">DESCARGAR</button>
<br>
<canvas id="canvas"></canvas>
<canvas id="subsCanvas" style="position:absolute"></canvas>
<video id="video" style="display:none"></video>
<script>
document.getElementById('videoInput').onchange=e=>{
document.getElementById('video').src=URL.createObjectURL(e.target.files[0]);
document.getElementById('video').play();
reproducir();
}
function reproducir(){
const v=document.getElementById('video');
const c=document.getElementById('canvas');
const s=document.getElementById('subsCanvas');
const ctx=c.getContext('2d');
const ctxs=s.getContext('2d');
v.onloadedmetadata=()=>{c.width=v.videoWidth;c.height=v.videoHeight;s.width=v.videoWidth;s.height=v.videoHeight;}
setInterval(()=>{ctx.drawImage(v,0,0);ctxs.clearRect(0,0,s.width,s.height);ctxs.font='bold 50px Impact';ctxs.fillStyle='#FFD700';ctxs.strokeStyle='#000';ctxs.lineWidth=5;ctxs.textAlign='center';ctxs.strokeText('HOLA BRO',s.width/2,s.height-50);ctxs.fillText('HOLA BRO',s.width/2,s.height-50);},100);
}
</script>
</body>
</html>
